name: Build Cyber Shield Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          python3-dev \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          zlib1g-dev \
          libsqlite3-dev \
          sqlite3 \
          bzip2 \
          libbz2-dev \
          libssl-dev \
          openssl \
          libgdbm-dev \
          libgdbm-compat-dev \
          liblzma-dev \
          libffi-dev \
          libncurses-dev \
          zip \
          unzip \
          autoconf \
          libtool \
          cmake \
          pkg-config

    - name: Install Buildozer & Dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer==1.5.0 cython==0.29.33 kivy==2.3.0 virtualenv

    - name: Build APK with Buildozer
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSES: '1'
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        cd mobile_app
        buildozer -v android debug

    - name: Upload Cyber Shield Pro Matrix APK
      uses: actions/upload-artifact@v4
      with:
        name: CyberShield-Pro-Matrix-APK
        path: mobile_app/bin/*.apk
        retention-days: 30
